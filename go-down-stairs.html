<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>復古小精靈下樓梯 - 終極版</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #333;
            background-image: radial-gradient(#666 1px, transparent 0);
            background-size: 25px 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            color: white;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            border: 8px solid #111;
            background-color: #222;
        }

        canvas { display: block; }

        #ui-layer {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            pointer-events: none;
            color: #0f0;
            font-weight: bold;
            text-shadow: 2px 2px 2px #000;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
        }

        #ai-status {
            color: #ff0;
            background: rgba(255, 0, 0, 0.3);
            padding: 2px 5px;
            border-radius: 3px;
            visibility: hidden; /* 由 JS 控制 */
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
        }

        button {
            padding: 10px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            background: #444;
            color: #fff;
            border: 2px solid #888;
            border-radius: 5px;
        }

        button:hover { background: #666; }
        button.active { background: #b00; border-color: #f00; }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #msg-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0;
            font-size: 30px;
            font-weight: bold;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <div id="ui-layer">
        <div>分數: <span id="score-val">0</span> <span id="ai-status">AUTO</span></div>
        <div>速度: <span id="speed-val">2.0</span></div>
    </div>
    <div id="msg-box">SPEED UP!</div>
    <div id="overlay">
        <h1 style="color: #f44; font-size: 40px;">GAME OVER</h1>
        <p id="final-score" style="font-size: 24px;">得分: 0</p>
        <button onclick="resetGame()">重新開始 (R)</button>
    </div>
</div>

<div class="controls">
    <button id="btn-pause" onclick="togglePause()">暫停 (P)</button>
    <button id="btn-ai" onclick="toggleAI()">代打模式 (A)</button>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('score-val');
    const speedVal = document.getElementById('speed-val');
    const overlay = document.getElementById('overlay');
    const aiStatus = document.getElementById('ai-status');
    const msgBox = document.getElementById('msg-box');

    // 遊戲狀態
    let player, platforms, score, gameActive, isPaused, frameCount, platformsSpawned, isAI;
    let platformSpeed = 2.0;
    let keys = {};

    // 聲音合成
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playScream() {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 1.5);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 1.5);
    }

    function playJump() {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.connect(audioCtx.destination);
        osc.connect(gain);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    window.addEventListener('keydown', e => {
        keys[e.code] = true;
        if(e.code === 'KeyP') togglePause();
        if(e.code === 'KeyA') toggleAI();
        if(e.code === 'KeyR' && !gameActive) resetGame();
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    class Player {
        constructor() {
            this.width = 24;
            this.height = 24;
            this.reset();
        }
        reset() {
            this.x = canvas.width / 2 - 12;
            this.y = 100;
            this.vx = 0;
            this.vy = 0;
            this.onConveyor = 0; // 傳送帶推力
        }

        update() {
            if (isAI) {
                this.autoMove();
            } else {
                if (keys['ArrowLeft']) this.vx = -5;
                else if (keys['ArrowRight']) this.vx = 5;
                else this.vx = 0;
            }

            // 加上傳送帶速度
            this.x += (this.vx + this.onConveyor);
            this.vy += 0.45; // 重力
            this.y += this.vy;

            if (this.x < 0) this.x = 0;
            if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;

            if (this.y > canvas.height || this.y < 0) endGame();
            this.onConveyor = 0; // 每幀重置
        }

        autoMove() {
            let target = null;
            let minDist = Infinity;
            // AI 找尋最近的非尖刺平台，且不優先選脆弱平台
            platforms.forEach(p => {
                if (p.type !== 'spike' && p.y > this.y) {
                    let d = p.y - this.y;
                    if (d < minDist) {
                        minDist = d;
                        target = p;
                    }
                }
            });

            if (target) {
                let tx = target.x + target.width / 2;
                let px = this.x + this.width / 2;
                // AI 會補償傳送帶
                let compensation = this.onConveyor;
                if (px < tx - 10) this.vx = 5;
                else if (px > tx + 10) this.vx = -5;
                else this.vx = -compensation;
            }
        }

        draw() {
            ctx.fillStyle = '#0ff';
            // 小精靈鬼魂
            ctx.beginPath();
            ctx.arc(this.x + 12, this.y + 10, 10, Math.PI, 0);
            ctx.lineTo(this.x + 22, this.y + 24);
            for (let i = 0; i < 3; i++) {
                ctx.lineTo(this.x + 22 - (i * 7), this.y + 20);
                ctx.lineTo(this.x + 22 - (i * 7 + 3.5), this.y + 24);
            }
            ctx.lineTo(this.x + 2, this.y + 24);
            ctx.fill();
            // 眼睛
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(this.x + 8, this.y + 8, 3, 0, Math.PI * 2);
            ctx.arc(this.x + 16, this.y + 8, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(this.x + 8 + (this.vx >= 0 ? 1 : -1), this.y + 8, 1.5, 0, Math.PI * 2);
            ctx.arc(this.x + 16 + (this.vx >= 0 ? 1 : -1), this.y + 8, 1.5, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    class Platform {
        constructor(y, type) {
            this.width = 75;
            this.height = 12;
            this.x = Math.random() * (canvas.width - this.width);
            this.y = y;
            this.type = type; // normal, spike, spring, fragile, convL, convR
            this.broken = false;
            this.breakTimer = 0;
        }

        update() {
            this.y -= platformSpeed;
            if (this.broken) {
                this.breakTimer++;
            }
        }

        draw() {
            if (this.broken && this.breakTimer > 10) return; // 碎裂消失

            ctx.lineWidth = 2;
            switch(this.type) {
                case 'normal':
                    ctx.fillStyle = '#eee';
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                    break;
                case 'spike':
                    ctx.fillStyle = '#f33';
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                    for(let i=0; i<this.width; i+=10) {
                        ctx.beginPath();
                        ctx.moveTo(this.x + i, this.y);
                        ctx.lineTo(this.x + i + 5, this.y - 10);
                        ctx.lineTo(this.x + i + 10, this.y);
                        ctx.fill();
                    }
                    break;
                case 'spring':
                    ctx.fillStyle = '#3f3';
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                    ctx.strokeStyle = '#fff';
                    ctx.strokeRect(this.x + 10, this.y - 5, this.width - 20, 5);
                    break;
                case 'fragile':
                    ctx.fillStyle = this.broken ? '#550' : '#ff3';
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                    ctx.strokeStyle = '#000';
                    ctx.beginPath(); // 裂紋
                    ctx.moveTo(this.x + 20, this.y); ctx.lineTo(this.x + 30, this.y + 12);
                    ctx.stroke();
                    break;
                case 'convL':
                case 'convR':
                    ctx.fillStyle = '#33f';
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                    ctx.fillStyle = '#fff';
                    ctx.font = "10px Arial";
                    ctx.fillText(this.type === 'convL' ? "<<<<<" : ">>>>>", this.x + 5, this.y + 10);
                    break;
            }
        }
    }

    function spawnPlatform(y) {
        const rand = Math.random();
        let type = 'normal';
        if (rand > 0.85) type = 'spike';
        else if (rand > 0.75) type = 'spring';
        else if (rand > 0.65) type = 'fragile';
        else if (rand > 0.55) type = 'convL';
        else if (rand > 0.45) type = 'convR';
        
        platformsSpawned++;
        if (platformsSpawned % 6 === 0) {
            platformSpeed += 0.3;
            showMsg("SPEED UP!");
        }
        return new Platform(y, type);
    }

    function showMsg(txt) {
        msgBox.innerText = txt;
        msgBox.style.opacity = 1;
        setTimeout(() => msgBox.style.opacity = 0, 800);
    }

    function resetGame() {
        player = new Player();
        platforms = [];
        score = 0;
        frameCount = 0;
        platformsSpawned = 0;
        platformSpeed = 2.0;
        gameActive = true;
        isPaused = false;
        overlay.style.display = 'none';
        for (let i = 0; i < 8; i++) {
            platforms.push(new Platform(300 + i * 70, 'normal'));
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        requestAnimationFrame(gameLoop);
    }

    function togglePause() {
        isPaused = !isPaused;
        document.getElementById('btn-pause').innerText = isPaused ? "繼續 (P)" : "暫停 (P)";
        if (!isPaused) requestAnimationFrame(gameLoop);
    }

    function toggleAI() {
        isAI = !isAI;
        aiStatus.style.visibility = isAI ? 'visible' : 'hidden';
        document.getElementById('btn-ai').classList.toggle('active', isAI);
    }

    function endGame() {
        if (!gameActive) return;
        gameActive = false;
        playScream();
        overlay.style.display = 'flex';
        document.getElementById('final-score').innerText = `得分: ${Math.floor(score)}`;
    }

    function checkCollision() {
        platforms.forEach(p => {
            if (p.broken && p.breakTimer > 5) return;

            if (player.vy > 0 &&
                player.x + player.width > p.x &&
                player.x < p.x + p.width &&
                player.y + player.height > p.y &&
                player.y + player.height < p.y + p.height + player.vy + platformSpeed) {
                
                if (p.type === 'spike') {
                    endGame();
                } else {
                    player.y = p.y - player.height;
                    
                    if (p.type === 'spring') {
                        player.vy = -12;
                        playJump();
                    } else {
                        player.vy = -platformSpeed;
                    }

                    if (p.type === 'fragile') p.broken = true;
                    if (p.type === 'convL') player.onConveyor = -3;
                    if (p.type === 'convR') player.onConveyor = 3;
                }
            }
        });
    }

    function drawCeilingSpikes() {
        ctx.fillStyle = '#444';
        for(let i=0; i<canvas.width; i+=20) {
            ctx.beginPath();
            ctx.moveTo(i, 0); ctx.lineTo(i+10, 15); ctx.lineTo(i+20, 0);
            ctx.fill();
        }
    }

    function gameLoop() {
        if (!gameActive || isPaused) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawCeilingSpikes();

        player.update();
        checkCollision();
        player.draw();

        // 階梯密集度隨速度調整
        let spawnInterval = Math.max(25, 60 - (platformSpeed * 5));
        if (frameCount % Math.floor(spawnInterval) === 0) {
            platforms.push(spawnPlatform(canvas.height));
        }

        platforms.forEach((p, index) => {
            p.update();
            p.draw();
            if (p.y + p.height < 0) platforms.splice(index, 1);
        });

        score += 0.1;
        scoreVal.innerText = Math.floor(score);
        speedVal.innerText = platformSpeed.toFixed(1);
        frameCount++;

        requestAnimationFrame(gameLoop);
    }

    resetGame();
</script>

</body>
</html>
